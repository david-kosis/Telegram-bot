name: Python validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile Python source
        run: python -m py_compile bot.py
      - name: Smoke-test module import
        env:
          BOT_TOKEN: "ci-placeholder-token"
        run: python -c "import bot; assert bot.COINS['btc'] == 'bitcoin'; assert bot.COINS['eth'] == 'ethereum'; assert bot.COINS['sol'] == 'solana'; print('Bot import and coin mappings passed')"
